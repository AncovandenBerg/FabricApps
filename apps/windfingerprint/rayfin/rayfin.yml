id: windfingerprint
name: WindFingerprint
version: 1.0.11
services:
  auth:
    enabled: true
    customClaims:
      app_version: 1.0.0
    scopes:
      - read:data
      - write:data
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://jazzy-dew-2f6bffac4d-westeurope.webapp.fabricapps.net
    fabric:
      enabled: true
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: false # Local dev/testing only -- Fabric doesn't support deploying Functions to
                  # production yet ("Functions are not supported yet" 400 from rayfin up,
                  # confirmed 2026-09-17). Flip to true locally for functions dev; always
                  # false before any `rayfin up*` until Fabric ships support.
    buildCommand: npm run build
  storage:
    enabled: false
